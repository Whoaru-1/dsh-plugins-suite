<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SPSS analysis">
  <defs>
    <linearGradient id="spss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#spss-bg)"/>
  <!-- data columns: a small bar chart, the SPSS signature shape -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="14" y="34" width="7" height="16" rx="2"/>
    <rect x="25" y="26" width="7" height="24" rx="2"/>
    <rect x="36" y="18" width="7" height="32" rx="2"/>
    <rect x="47" y="30" width="7" height="20" rx="2" opacity="0.65"/>
  </g>
  <!-- the normal curve drawn over the bars -->
  <path d="M11 44c7 0 9-14 21-14s14 14 21 14" fill="none" stroke="#fde68a" stroke-width="2.6"
        stroke-linecap="round" opacity="0.95"/>
  <circle cx="32" cy="30" r="2.4" fill="#fde68a"/>
</svg>
